// model.cfg for afstg44.p3d, afstg44_mag.p3d and afzf4.p3d
//
// The AF StG 44 inherits from the vanilla AKM, so the skeleton below is a copy of the one built
// into the vanilla model (dz\weapons\firearms\AKM\akm.p3d): the same bone names, in the same
// order, none of them with a parent. The AKM's firing, reload and trigger animations then drive
// this model's parts.
//
// Named selections in afstg44.p3d:
//   trigger      the trigger
//   bolt         the bolt carrier (seen through the ejection port) and the cocking handle
//   magazine     the magazine proxy
//   (firemode, mag_release, bullet   unused: the selector and magazine catch do not move)

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF_StG44_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"
			"magazine",    "",
			"trigger",     "",
			"bolt",        "",
			"firemode",    "",
			"mag_release", "",
			"bullet",      ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class names MUST equal the p3d file names
	class afstg44: Default
	{
		skeletonName = "AF_StG44_Skeleton";
		sections[] = {"camo", "hide_barrel", "camo1"};   // camo = steel, camo1 = beech, hide_barrel = muzzle nut
		class Animations {};      // bone movement comes from the AKM animations
	};

	class afstg44_mag: Default
	{
		sections[] = {"camo"};
	};

	class afzf4: Default
	{
		sections[] = {"camo"};
	};
};
