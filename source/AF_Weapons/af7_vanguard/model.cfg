// model.cfg for af7_vanguard.p3d
// Tells DayZ which parts of the model are bones (can move) and which
// selections can be retextured.
//
// Bone names are CONFIRMED from the vanilla M4 animation
// (dz\anims\anm\player\reloads\M4A1\w_M4A1_states.anm). The M4 has no
// boneRemap[], so the named selections in your model must use exactly
// these names. That's how the M4 reload/fire animations move your parts.

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF7_Vanguard_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"  ("" = attached to the gun itself)
			"Weapon_Trigger",  "",
			"Weapon_Bolt",     "",
			"Weapon_Magazine", "",   // the magazine proxy goes in this selection
			"Weapon_Bullet",   "",   // chambered round (optional)
			// Extra M4 bones. Their jobs aren't named in the animation file.
			// Likely candidates: charging handle, dust cover, bolt catch,
			// mag release, safety. Find out which is which with GUIDE step 9b.
			"Weapon_Bone_01",  "",
			"Weapon_Bone_02",  "",
			"Weapon_Bone_03",  "",
			"Weapon_Bone_04",  "",
			"Weapon_Bone_05",  "",
			"Weapon_Bone_06",  ""
		};

	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class name MUST equal the p3d file name (af7_vanguard.p3d)
	class af7_vanguard: Default
	{
		skeletonName = "AF7_Vanguard_Skeleton";
		sections[] = {"camo", "hide_barrel"};   // camo = retexturable body, hide_barrel = muzzle brake (hidden when a suppressor is on)
		class Animations {};      // bone movement comes from the M4 animations
	};
};
