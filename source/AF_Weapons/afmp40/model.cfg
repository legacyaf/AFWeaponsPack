// model.cfg for afmp40.p3d and afmp40_mag.p3d
//
// The AF MP40 inherits from the vanilla UMP-45, so the skeleton below is a copy of the one built
// into the vanilla model (dz\weapons\firearms\UMP45\ump.p3d): the same bone names, in the same
// order, with the same parents. The UMP's firing, reload and trigger animations then drive this
// model's parts.
//
// Named selections in afmp40.p3d:
//   recoil     the whole gun body (kicks when the gun fires)
//   trigger    the trigger
//   bolt       the bolt, seen through the ejection port
//   charging   the cocking handle on the left
//   magazine   the magazine proxy
//   (bullet    unused)

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF_MP40_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"
			"magazine", "",
			"trigger",  "",
			"recoil",   "",
			"bolt",     "recoil",
			"charging", "recoil",
			"bullet",   "recoil"
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class names MUST equal the p3d file names
	class afmp40: Default
	{
		skeletonName = "AF_MP40_Skeleton";
		sections[] = {"camo", "hide_barrel", "camo1"};   // camo = steel, camo1 = bakelite, hide_barrel = muzzle nut
		class Animations {};      // bone movement comes from the UMP animations
	};

	class afmp40_mag: Default
	{
		sections[] = {"camo"};
	};
};
