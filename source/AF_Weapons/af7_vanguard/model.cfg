// model.cfg for af7_vanguard.p3d
// Tells DayZ which parts of the model are bones (can move) and which
// selections can be retextured.
//
// IMPORTANT: The bone names MUST match the vanilla M4's names, because
// we borrow the M4's animations (dz\anims\anm\player\reloads\M4A1\w_M4A1_states.anm).
// The vanilla M4A1 config has no boneRemap[], so the names below are still
// a best guess - see docs/GUIDE.md step 0 for where to find the real ones.

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF7_Vanguard_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"  ("" = attached to the gun itself)
			"bolt",      "",   // VERIFY
			"magazine",  "",   // VERIFY - the magazine proxy goes in this selection
			"bullet",    "",   // VERIFY - chambered round
			"trigger",   ""    // VERIFY
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class name MUST equal the p3d file name (af7_vanguard.p3d)
	class af7_vanguard: Default
	{
		skeletonName = "AF7_Vanguard_Skeleton";
		sections[] = {"camo", "hide_barrel"};   // camo = retexturable body, hide_barrel = muzzle brake (hidden when a suppressor is on)
		class Animations {};      // bone movement comes from the M4 animations
	};
};
