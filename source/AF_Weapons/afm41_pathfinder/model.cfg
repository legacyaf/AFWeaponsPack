// model.cfg for afm41_pathfinder.p3d
//
// The M41 inherits from the vanilla Mosin 91/30, so the skeleton below is a copy of the
// one built into the vanilla model (dz\weapons\firearms\mosin9130\mosin9130.p3d): the same
// bone names, in the same order, with the same parents. The Mosin's bolt, reload and
// trigger animations then drive this model's parts.
//
// Named selections in afm41_pathfinder.p3d:
//   trigger      the trigger
//   boltbody     the bolt and the cocking piece
//   bolthandle   the turned-down handle and knob
//   (boltbodys   unused, as on the vanilla model)
//   bullet1      top display round in the magazine
//   bullet       second display round in the magazine
// magazine and rotation_a/b are listed only to keep the vanilla order; neither this model
// nor the vanilla one has parts in them.

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AFM41_Pathfinder_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"
			"magazine",   "",
			"trigger",    "",
			"rotation_b", "",
			"rotation_a", "rotation_b",
			"bullet",     "",
			"bullet1",    "",
			"boltbodys",  "",
			"boltbody",   "",
			"bolthandle", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class name MUST equal the p3d file name (afm41_pathfinder.p3d)
	class afm41_pathfinder: Default
	{
		skeletonName = "AFM41_Pathfinder_Skeleton";
		sections[] = {"camo", "hide_barrel", "camo1"};   // camo = retexturable body, hide_barrel = muzzle crown
		class Animations {};      // bone movement comes from the Mosin animations
	};
};
