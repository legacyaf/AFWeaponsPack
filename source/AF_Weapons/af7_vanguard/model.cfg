// model.cfg for af7_vanguard.p3d
// Tells DayZ which parts of the model are bones (can move) and which
// selections can be retextured.
//
// The AF-7 inherits from the vanilla M4A1, which has no boneRemap[] in its
// config. So the skeleton below is a copy of the one built into the vanilla
// model (dz\weapons\firearms\m4\m4a1.p3d): the same bone names, in the same
// order. Whatever the engine does to drive the M4's parts with the
// Weapon_Bolt / Weapon_Trigger / ... animation bones, it does the same here.
//
// Named selections that exist in af7_vanguard.p3d:
//   trigger, bolt, charging (charging handle), magazine (the magazine proxy)
// The other bones are listed only to keep the vanilla order; the model has no
// parts in them, which is fine.

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF7_Vanguard_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"  ("" = attached to the gun itself)
			"magazine",         "",   // the magazine proxy is in this selection
			"trigger",          "",
			"bolt",             "",
			"bullet_cover",     "",
			"aimpoint_cover",   "",
			"aimpoint_cover02", "",
			"charging_handle",  "",
			"firemode",         "",   // safety / fire selector (static on the AF-7 for now)
			"misc_cover",       "",
			"bullet",           "",   // chambered round (not modelled)
			"charging",         "",   // charging handle
			"boltrelease",      ""    // bolt catch (static on the AF-7 for now)
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class name MUST equal the p3d file name (af7_vanguard.p3d)
	class af7_vanguard: Default
	{
		skeletonName = "AF7_Vanguard_Skeleton";
		sections[] = {"camo", "hide_barrel", "camo1"};   // camo = retexturable body, hide_barrel = muzzle brake (hidden when a suppressor is on)
		class Animations {};      // bone movement comes from the M4 animations
	};
};
