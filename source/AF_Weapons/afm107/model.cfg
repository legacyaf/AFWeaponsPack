// model.cfg for afm107.p3d, afm107_mag.p3d and afm107_scope.p3d
//
// The AF M107A1 inherits from the vanilla SVD, so the skeleton below is a copy of the one built into
// the vanilla model (dz\weapons\firearms\svd\svd.p3d, read 2026-11-23): the same bone names, in the
// same order, none of them with a parent. The SVD's firing, reload and trigger animations then drive
// this model's parts.
//
// Named selections in afm107.p3d:
//   trigger      the trigger
//   bolt         the bolt carrier, seen through the ejection window
//   magazine     the magazine proxy
//   (firemode, mag_release, bullet   unused)

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF_M107_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"
			"magazine",    "",
			"trigger",     "",
			"bolt",        "",
			"firemode",    "",
			"bullet",      "",
			"mag_release", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class names MUST equal the p3d file names
	class afm107: Default
	{
		skeletonName = "AF_M107_Skeleton";
		sections[] = {"camo"};
		class Animations {};      // bone movement comes from the SVD animations
	};

	class afm107_mag: Default
	{
		sections[] = {"camo"};
	};

	class afm107_scope: Default
	{
		sections[] = {"camo"};
	};
};
