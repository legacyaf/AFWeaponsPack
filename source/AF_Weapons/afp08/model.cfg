// model.cfg for afp08.p3d and afp08_mag.p3d
//
// The AF P08 inherits from the vanilla P1, so the skeleton below is a copy of the one built
// into the vanilla model (dz\weapons\pistols\p1\p1.p3d): the same bone names, in the same
// order, with the same parents. The P1's firing, reload and trigger animations then drive this
// model's parts.
//
// Named selections in afp08.p3d:
//   recoil     the whole pistol (kicks when it fires)
//   trigger    the trigger
//   bolt       the breechblock and extractor (the P1's slide is on this bone)
//   magazine   the magazine proxy
//   (slide, hammer, slide_catch, bullet: unused; the P08 has no hammer)

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF_P08_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"
			"magazine",    "",
			"trigger",     "",
			"recoil",      "",
			"slide",       "recoil",
			"hammer",      "recoil",
			"bolt",        "recoil",
			"slide_catch", "recoil",
			"bullet",      "recoil"
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class names MUST equal the p3d file names
	class afp08: Default
	{
		skeletonName = "AF_P08_Skeleton";
		sections[] = {"camo"};
		class Animations {};      // bone movement comes from the P1 animations
	};

	class afp08_mag: Default
	{
		sections[] = {"camo"};
	};
};
