// model.cfg for afpk.p3d (The PeaceKeeper) and afpk_stock.p3d (its AF stock)
//
// The PeaceKeeper inherits from the vanilla SCAR-H, so the skeleton below has the bone names of the one
// built into the vanilla model (dz\weapons\firearms\scarh\scarh.p3d, read 2026-11-26): the same names, in
// the same order, none of them with a parent. The SCAR-H's firing, reload and trigger animations then
// drive this model's parts.
//
// Named selections in afpk.p3d:
//   trigger      the trigger
//   bolt         the bolt carrier, seen through the ejection port
//   charging     the charging handle and its knob
//   firemode     the safety levers
//   boltrelease  the bolt release
//   magazine     the magazine proxy
//   camo .. camo5  the six texture sheets (camo4: the round counter's display, swapped by script;
//                  camo5: the gold sights)
//   (bullet, front_sight   unused: the PeaceKeeper's gold sights are part of the body)

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class AF_PeaceKeeper_Skeleton: Default
	{
		skeletonInherit = "";
		skeletonBones[] =
		{
			// "bone", "parent bone"
			"magazine",    "",
			"trigger",     "",
			"bolt",        "",
			"bullet",      "",
			"charging",    "",
			"firemode",    "",
			"boltrelease", "",
			"front_sight", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	// Class names MUST equal the p3d file names
	class afpk: Default
	{
		skeletonName = "AF_PeaceKeeper_Skeleton";
		sections[] = {"camo", "camo1", "camo2", "camo3", "camo4", "camo5"};
		class Animations {};      // bone movement comes from the SCAR-H animations
	};

	class afpk_stock: Default
	{
		sections[] = {"camo"};
	};
};
